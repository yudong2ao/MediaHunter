# ==============================================================================
# 🎯 MediaHunter - yt-dlp 核心引擎配置文件
# ==============================================================================
# 本配置文件用于集中管理底层的下载行为、身份伪装、网络代理及保存路径。
# 井号(#)开头的行为注释行。在修改参数后，下一次下载任务启动时即可直接生效。
# ==============================================================================

# ==============================================================================
# 📂 一、基础自定义配置（最常修改的部分）
# ==============================================================================

# 1. 下载保存路径（必须修改为您的电脑上真实存在的实际目录）
--paths "temp:temp"                             # 临时缓存目录（项目同级目录下的 temp 文件夹，合并完成后自动清理）
--paths "home:downloads"                        # 最终下载保存目录（项目同级目录下的 downloads 文件夹）

# 💡 提示：如果您希望指定其他固定保存路径（例如 D 盘），可参考并取消下方注释进行配置：
#--paths "temp:D:\Cache"                         # 绝对路径示例：D盘下的缓存文件夹
#--paths "home:D:\Downloads"                     # 绝对路径示例：D盘下的下载/保存文件夹

# 2. 网络代理设置（若无需科学上网，请在行首添加 # 注释掉此行）
--proxy "socks5://127.0.0.1:10808"              # 支持 socks5 / http 代理，用于拉取海外或特定网络资源

# 3. 下载限速控制
--limit-rate 5M                                 # 限制单任务最大下载速度（例如 5M 代表 5MB/s，不限速请注释掉此行）


# ==============================================================================
# 💻 二、浏览器 Cookie 与身份伪装（请根据您的主力浏览器进行选择）
# ==============================================================================
# ⚠️ 重要提示：请选择使用下方【方案 A】或【方案 B】其中一类。
# 启用一类时，必须将另一类对应的配置全部用井号(#)注释掉，切勿同时混用！
# ==============================================================================

# ------------------------------------------------------------------------------
# 🦊 方案 A：使用 Firefox 浏览器（🔥 强烈推荐，提取 Cookie 最为稳定且不被锁死）
# ------------------------------------------------------------------------------
# 优点：无需导出文件，支持实时在线热提取，只要 Firefox 登录即可直接下载 VIP 视频。
--cookies-from-browser firefox
--impersonate "firefox"
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:148.0) Gecko/20100101 Firefox/148.0"

# ------------------------------------------------------------------------------
# 🌐 方案 B：使用 Chrome浏览器（⚠️ 自动提取基本无效，必须使用备用导出的 cookies.txt）
# ------------------------------------------------------------------------------
# 警告：由于 Chromium 的安全加密与独占锁，使用 --cookies-from-browser 自动提取几乎 100% 失败。
# 解决办法：请使用浏览器插件（如 Get Cookies.txt）将 Cookie 导出为 `cookies.txt` 文件放入本网关同级目录下。
#--cookies "cookies.txt"                         # 手动配置的 Cookie 路径（启用此方案时，请取消本行注释）
#--impersonate "chrome"
#--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"



# ==============================================================================
# 🛠️ 三、JavaScript 解密运行环境（可选，用于解析 YouTube 等站点的本地解密）
# ==============================================================================
# 下载 YouTube 等具有加密混淆算法的站点时，引擎会自动在【同级目录】或【环境变量】下寻找 Deno/Node.js 进行解密。
#
# 💡 提示：如果您使用的是【全能集成包】，同级目录下已自带 deno.exe，此处无需进行任何配置，引擎会自动寻找并调用。
# 💡 提示：如果您使用的是【纯净轻量包】且全局安装了 Node.js，可以取消下方注释来强制指定使用 Node：
#--js-runtimes node


# ==============================================================================
# ⚙️ 四、下载行为与容错控制（建议保持默认，无需修改）
# ==============================================================================

--concurrent-fragments 6                        # 分片并发下载线程数（建议设置在 5~8 之间以榨干宽带）
--embed-metadata                                # 自动在下载完的文件中嵌入封面、标题等元数据
--no-check-certificate                          # 忽略 HTTPS 证书有效性检查，防止因证书链问题导致下载中断
--legacy-server-connect                         # 允许连接不支持安全重新协商的旧式 SSL 服务器
--skip-unavailable-fragments                    # 自动跳过下载失败的损坏分片，防止阻塞整体任务进度
#--fragment-retries 20                           # 备用：分片下载失败时的重试次数限制（默认 10 次，网络较差时可设为 20 或 infinite）
#--console-title                                # 备用：在控制台窗口标题显示下载进度（静默下载模式下已默认隐藏）


# ==============================================================================
# 🛡️ 五、高级 HTTP 请求头伪装（用于穿透视频网站高强度防盗链，建议固定）
# ==============================================================================

--add-header "Sec-Fetch-Dest: empty"
--add-header "Sec-Fetch-Mode: cors"
--add-header "Sec-Fetch-Site: cross-site"
--add-header "Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
--add-header "Accept-Encoding: gzip, deflate, br"


# ==============================================================================
# 📝 六、调试与日志输出
# ==============================================================================

--verbose                                       # 输出详细日志（当下载失败时，方便去 logs 目录下通过错误文件排查具体原因）
